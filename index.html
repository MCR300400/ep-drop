<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ep-drop — Condivisione File & Appunti Istantanea P2P</title>
    <meta name="description" content="Condividi file e sincronizza appunti tra i tuoi dispositivi istantaneamente via WebSocket e WebRTC senza registrazione né server di archiviazione." />
    <script>
      (function () {
        try {
          var salvato = localStorage.getItem('ep_tema');
          var tema = (salvato === 'light' || salvato === 'dark') ? salvato : 'dark';
          document.documentElement.setAttribute('data-theme', tema);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
